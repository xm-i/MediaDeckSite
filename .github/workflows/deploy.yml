name: Deploy

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_USER: deploy
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_PATH: /opt/mediadeck.xm-i.net/
  DEPLOY_PORT: 30532

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_ENV: production
        run: npm run build

      - name: Publish backend
        run: dotnet publish backend/MediaDeckSite.csproj -c Release -o publish

      - name: Create appsettings.json from Secrets
        shell: bash
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          for v in DB_CONNECTION SLACK_BOT_TOKEN SLACK_CHANNEL_ID; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret: $v" >&2
              exit 1
            fi
          done
          jq -n \
            --arg db "$DB_CONNECTION" \
            --arg slack_token "$SLACK_BOT_TOKEN" \
            --arg slack_channel "$SLACK_CHANNEL_ID" \
            '{
              Logging: {
                LogLevel: {
                  Default: "Information",
                  "Microsoft.AspNetCore": "Warning"
                }
              },
              AllowedHosts: "*",
              ConnectionStrings: {
                DefaultConnection: $db
              },
              Slack: {
                BotToken: $slack_token,
                ChannelId: $slack_channel
              }
            }' > publish/appsettings.json

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ env.DEPLOY_PORT }}" "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync
        if: ${{ success() }}
        run: |
          RSYNC_RSH="ssh -p ${DEPLOY_PORT} -o StrictHostKeyChecking=yes"
          rsync -avz --delete -e "${RSYNC_RSH}" publish/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Restart service
        if: ${{ success() }}
        run: |
          ssh -p "${DEPLOY_PORT}" -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo systemctl restart mediadeck.service"
